name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: dexscreener-mcp-server
  GAR_LOCATION: us-central1
  REPOSITORY: dexscreener-mcp-images
  IMAGE_NAME: dexscreener-mcp-server

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - id: deploy-config
        name: Check deployment configuration
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER || vars.GCP_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT || vars.GCP_WIF_SERVICE_ACCOUNT }}
        run: |
          missing=()
          [[ -n "${PROJECT_ID}" ]] || missing+=("GCP_PROJECT_ID")
          [[ -n "${WIF_PROVIDER}" ]] || missing+=("GCP_WIF_PROVIDER")
          [[ -n "${WIF_SERVICE_ACCOUNT}" ]] || missing+=("GCP_WIF_SERVICE_ACCOUNT")

          if (( ${#missing[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Cloud Run deployment because these GitHub Actions variables or secrets are missing: ${missing[*]}"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "wif_provider=${WIF_PROVIDER}" >> "$GITHUB_OUTPUT"
          echo "wif_service_account=${WIF_SERVICE_ACCOUNT}" >> "$GITHUB_OUTPUT"

      - id: auth
        name: Authenticate to Google Cloud
        if: steps.deploy-config.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.deploy-config.outputs.wif_provider }}
          service_account: ${{ steps.deploy-config.outputs.wif_service_account }}

      - name: Set up Cloud SDK
        if: steps.deploy-config.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Authentication
        if: steps.deploy-config.outputs.configured == 'true'
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and Push Image
        if: steps.deploy-config.outputs.configured == 'true'
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push --all-tags "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"

      - name: Deploy to Cloud Run
        if: steps.deploy-config.outputs.configured == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
